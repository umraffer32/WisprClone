# WisprClone settings. Restart the app (tray > Quit, relaunch) after editing.

[hotkeys]
ptt = "x2"            # "x1", "x2", or a keyboard key name (pynput), e.g. "f9"
                      # the button is captured exclusively while the app runs
toggle_key = "ctrl_r"
toggle_max_tap_ms = 500
debounce_ms = 300

[audio]
duck = true           # lower other apps' volume while recording
duck_factor = 0.05    # they play at 5% while the mic is hot
idle_close_s = 10     # release the mic (and its tray icon) this many seconds
                      # after the last dictation. 0 = always hot
preroll_ms = 250
min_recording_s = 0.3
max_recording_s = 300
normalize_peak = 0.7  # boost a quiet/distant-mic recording toward this peak
                      # before transcription. 0 = disabled
blocksize = 512

[model]
name = "large-v3-turbo"  # alternatives: "distil-large-v3" (fastest), "large-v3" (best ears)
hotwords = "WisprClone, Wispr Flow, Claude, ClaudeMD, Fable, Ollama, qwen, Xeon, DDR3, SOQ, SC2, x64"
                          # personal vocabulary bias, mined from history.log
                          # (mine_vocab.py); keep short - over-biasing causes
                          # insertions
device = "auto"           # "auto" (CUDA then CPU), "cuda", "cpu"
compute_type = "float16"  # "int8_float16" halves VRAM
gpu_fail_latch = 3

[paste]
restore_delay_ms = 300
clipboard_retries = 5
clipboard_retry_ms = 20
result_display_s = 10  # how long the pill offers a click-to-repaste checkmark
continuation_gap_s = 0  # if the last dictation ended without a period and you
                       # dictate again within this long (in the same window),
                       # a period is stitched on before the new sentence.
                       # 0 = disabled: false-positives on unrelated messages
                       # in chat-style use outweighed the benefit

[polish]
enabled = true          # LLM cleanup for toggle-mode (long-form) dictations only
model = "qwen2.5:7b-instruct"  # served locally by Ollama at 127.0.0.1:11434
timeout_s = 8           # real polish runs 1-3s; past this, fall back to raw fast
min_ratio = 0.4         # reject the polish result outside [min_ratio, max_ratio]
max_ratio = 2.5         # of the original length - likely means the model misbehaved

[files]
corrections = "corrections.txt"
history = "history.log"
