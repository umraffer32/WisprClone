# WisprClone settings. Restart the app (tray > Quit, relaunch) after editing.

[hotkeys]
ptt = "x2"            # "x1", "x2", or a keyboard key name (pynput), e.g. "f9"
                      # the button is captured exclusively while the app runs
toggle_key = "ctrl_r"
toggle_max_tap_ms = 500
debounce_ms = 300

[audio]
duck = true           # lower other apps' volume while recording
duck_factor = 0.01    # they play at 1% while the mic is hot
idle_close_s = 10     # release the mic (and its tray icon) this many seconds
                      # after the last dictation. 0 = always hot. Briefly
                      # raised to 300 on 2026-08-27 over a clipping-risk
                      # theory (50-300ms device open, empty pre-roll on
                      # reopen); reverted the same day after a full day of
                      # real dictation at 10s never actually produced a
                      # clipped first word. Preferring the indicator
                      # clearing quickly over a theoretical risk that
                      # didn't show up in practice.
preroll_ms = 250
min_recording_s = 0.3
max_recording_s = 300
normalize_peak = 0.7  # boost a quiet/distant-mic recording toward this peak
                      # before transcription. 0 = disabled
blocksize = 512

[model]
name = "large-v3-turbo"  # alternatives: "distil-large-v3" (fastest), "large-v3" (best ears)
prompt = "Okay, so I've been testing WisprClone against Wispr Flow again. Claude, Fable, and Ollama all ran fine, and the SOQ draft and the CLAUDE.md file are done. Let's run it one more time and see what happens."
                          # the text Whisper reads as "what came before" each
                          # dictation: it imitates the style and favors the
                          # vocabulary. Until 2026-09-02 this was a bare comma
                          # list of hotwords; rewrapping the same words as
                          # punctuated sentences cut dictations pasted with no
                          # final period from 291 to 17 of 981 in replay, with
                          # no accuracy or latency cost and slightly better
                          # vocabulary recall (analysis_tools/results/README.md).
                          # Keep it a few sentences, keep the personal vocabulary
                          # in it, and keep it short: over-stuffing causes
                          # insertions, and this text is what Whisper echoes
                          # into an empty window (the x73 case, 2026-08-28).
                          # Vocabulary pruned 2026-09-01 to words actually
                          # dictated (qwen, SC2, x64, DDR3, Xeon dropped;
                          # corrections.txt still maps Xion=Xeon).
device = "auto"           # "auto" (CUDA then CPU), "cuda", "cpu"
compute_type = "float16"  # "int8_float16" halves VRAM
gpu_fail_latch = 3

[paste]
restore_delay_ms = 300
clipboard_retries = 5
clipboard_retry_ms = 20
result_display_s = 10  # how long the pill offers a click-to-repaste checkmark
continuation_gap_s = 4  # fallback only: the primary path reads the focused
                       # field via UI Automation and stitches a period onto
                       # an unfinished sentence only when the field still
                       # ends with the previous paste. When the field's text
                       # can't be read, this timer gates the old blind
                       # heuristic (same window, recent) instead.
                       # 0 = never stitch blind

[polish]
enabled = false         # LLM cleanup pass on dictations from either mode.
                        # Off since 2026-09-01 as a trial: over 548 real
                        # polished dictations the 9b changed nothing in 69%
                        # and only punctuation in another 21%, so the pass
                        # cost ~1s per dictation over min_audio_s for word
                        # level edits on about one in ten. Flip back to true
                        # (and restart) to re-enable; the model stays pulled.
min_audio_s = 8         # skip polish under this many seconds of audio - pure
                        # latency protection so quick bursts keep feeling
                        # instant (polish costs ~0.4-0.6s on a short clip).
                        # Started at 5 (tax noticeable on 5-8s clips), went
                        # to 10, settled at 8 - all same-day feel tuning.
model = "qwen3.5:9b"    # served locally by Ollama at 127.0.0.1:11434 -
                        # switched from qwen2.5:7b-instruct 2026-09-01 after a
                        # 548-dictation replay showed the 7b paraphrasing past
                        # the prompt (a real word deleted in 23% of accepted
                        # outputs, meanings inverted) and the 9b nearly never
                        # (2%), at ~0.3s more per polish. The request sends
                        # "think": false, or this model reasons instead of
                        # answering. The other polish models tried were
                        # removed from Ollama 2026-09-02; this is the only one
                        # pulled, and it stays while the polish-off trial runs.
timeout_s = 30          # covers the worst case max_recording_s allows: a 300s
                        # dictation polishes in ~16-18s measured on the 7b,
                        # ~20s by the 9b's fit, so 30 leaves headroom
                        # (re-derive if max_recording_s changes). An
                        # Ollama that isn't running fails on connect instantly
                        # regardless of this value.
min_ratio = 0.4         # reject the polish result outside [min_ratio, max_ratio]
max_ratio = 2.5         # of the original length - likely means the model misbehaved

[retain]
# Experiment data collected for the streaming merge-rule decision, not a
# feature: every dictation's audio is saved post-paste (same
# non-interference slot as the vad shadow) so mine_merge_rule.py can replay
# the chunked streaming pipeline offline against the full-clip transcript.
# WAV names match vad_shadow.log's "wav" field. Real streaming is shelved
# (LOG.md 2026-08-27, corrected felt-latency win too small to justify the
# build) - left running rather than torn out in case that changes. If it's
# not worth keeping unused: set max_mb = 0 and delete the directory.
dir = "retained_audio"  # gitignored
max_mb = 1000  # hard cap on the directory; oldest WAVs pruned first.
               # 16kHz mono int16 is ~2MB per minute of speech, so a heavy
               # hour-a-day week is ~800MB - the cap should outlast the
               # collection week, or pruning eats its earliest days.
               # 0 disables retention entirely.

[files]
corrections = "corrections.txt"
emphasis_words = "emphasis_words.txt"
history = "history.log"
